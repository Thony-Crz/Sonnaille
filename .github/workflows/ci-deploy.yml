# Tests on every push and pull request; GitHub Pages deployment by artifact from main.
# No gh-pages branch: Map Patou data must never be committed (docs/decisions.md, D1).
name: CI and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Every morning of the summer grazing season (June to October), 06:00 Paris summer time,
    # so the published planned presences stay current.
    - cron: '0 4 * 6-10 *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Pastoral zones (D1, D4): Map Patou is not reachable from GitHub runners, so a PC in France
      # publishes them each morning to the private repository Sonnaille-data (docs/donnees-zones.md),
      # read here with a read-only token. Never committed to this public repository.
      # Not blocking: without the token or the data, the site deploys and says the zones are unavailable.
      - id: zones
        run: echo "token=${{ secrets.SONNAILLE_DATA_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.zones.outputs.token == 'true'
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: Thony-Crz/Sonnaille-data
          token: ${{ secrets.SONNAILLE_DATA_TOKEN }}
          path: private-data
          persist-credentials: false
      - if: steps.zones.outputs.token == 'true'
        continue-on-error: true
        run: |
          mkdir -p public/data
          mv private-data/pastoral-zones.geojson public/data/
          rm -rf private-data
          npx tsx scripts/check-zones.ts
      # Angular front. Values given at build time (src/app/build-values.ts), both optional:
      # the personal IGN key for the 1:25,000 map (docs/fonds-de-carte.md) and the V1 sightings API (docs/api.md).
      - run: npm run build -- --define "SONNAILLE_SCAN25_KEY='$SCAN25_KEY'" --define "SONNAILLE_SIGHTINGS_API_URL='$SIGHTINGS_API_URL'"
        env:
          SCAN25_KEY: ${{ vars.IGN_SCAN25_KEY }}
          SIGHTINGS_API_URL: ${{ vars.SIGHTINGS_API_URL }}
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/browser

  # V1 sightings API (.NET): tested on every push, not deployed yet (docs/api.md).
  api:
    runs-on: ubuntu-latest
    # A throwaway PostGIS database, so the repository contract is also played on PostgreSQL.
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SONNAILLE_TEST_POSTGRES: Host=localhost;Username=postgres;Password=ci-only;Database=postgres
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
