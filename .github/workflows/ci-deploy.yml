# Tests on every push and pull request; GitHub Pages deployment by artifact from main.
# No gh-pages branch: Map Patou data must never be committed (docs/decisions.md, D1).
name: CI and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # No daily rebuild any more: the API keeps the zones of the day (D6).

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # No pastoral zones in the build: the site reads them from the API, which fetches them
      # from Map Patou and keeps them in its database (docs/decisions.md, D6; never committed, D1).
      # Angular front. Values given at build time (src/app/build-values.ts), both optional:
      # the personal IGN key for the 1:25,000 map (docs/fonds-de-carte.md) and the Sonnaille API (docs/api.md).
      - run: npm run build -- --define "SONNAILLE_SCAN25_KEY='$SCAN25_KEY'" --define "SONNAILLE_API_URL='$API_URL'"
        env:
          SCAN25_KEY: ${{ vars.IGN_SCAN25_KEY }}
          API_URL: ${{ vars.SONNAILLE_API_URL }}
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/browser

  # V1 sightings API (.NET): tested on every push, not deployed yet (docs/api.md).
  api:
    runs-on: ubuntu-latest
    # A throwaway PostGIS database, so the repository contract is also played on PostgreSQL.
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SONNAILLE_TEST_POSTGRES: Host=localhost;Username=postgres;Password=ci-only;Database=postgres
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
