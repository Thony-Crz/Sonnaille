# Tests on every push and pull request; GitHub Pages deployment by artifact from main.
# No gh-pages branch: Map Patou data must never be committed (docs/decisions.md, D1).
name: CI and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Every morning of the summer grazing season (June to October), 06:00 Paris summer time,
    # so the published planned presences stay current.
    - cron: '0 4 * 6-10 *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Pastoral zones from Map Patou: fetched at build time, never committed (D1).
      # The cache is keyed by day, so the API is called at most once per day.
      - id: day
        run: echo "today=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: public/data
          key: pastoral-zones-${{ steps.day.outputs.today }}
      # Not blocking: the Map Patou API is not reachable from GitHub runners (D4).
      # Without data, the site deploys and the app says the zones are unavailable.
      - run: npm run data
        continue-on-error: true
      - run: npm run build
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
