# Tests on every push and pull request; GitHub Pages deployment by artifact from main.
# No gh-pages branch: Map Patou data must never be committed (docs/decisions.md, D1).
name: CI and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Every morning of the summer grazing season (June to October), 06:00 Paris summer time,
    # so the published planned presences stay current.
    - cron: '0 4 * 6-10 *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Pastoral zones from Map Patou: fetched at build time, never committed (D1).
      # The cache is keyed by day, so the API is called at most once per day.
      - id: day
        run: echo "today=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: public/data
          key: pastoral-zones-${{ steps.day.outputs.today }}
      # Not blocking: the Map Patou API is not reachable from GitHub runners (D4).
      # Without data, the site deploys and the app says the zones are unavailable.
      - run: npm run data
        continue-on-error: true
      - run: npm run build
        env:
          # Personal IGN key for the 1:25,000 map (docs/fonds-de-carte.md). Optional: without it, the map is not offered.
          VITE_IGN_SCAN25_KEY: ${{ vars.IGN_SCAN25_KEY }}
          # V1 sightings API (docs/api.md). Optional: without it, sightings are published by hand on GitHub (V0).
          VITE_SIGHTINGS_API_URL: ${{ vars.SIGHTINGS_API_URL }}
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # V1 sightings API (.NET): tested on every push, not deployed yet (docs/api.md).
  api:
    runs-on: ubuntu-latest
    # A throwaway PostGIS database, so the repository contract is also played on PostgreSQL.
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SONNAILLE_TEST_POSTGRES: Host=localhost;Username=postgres;Password=ci-only;Database=postgres
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
